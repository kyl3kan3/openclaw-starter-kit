# Minimal OpenClaw + Ollama stack. Alternative to install.sh for container hosts.
# Loopback-bound by default — do not publish ports to 0.0.0.0 without a tunnel.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    restart: unless-stopped
    depends_on:
      - ollama
    env_file: .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./workspace:/home/openclaw/.openclaw
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  ollama:
