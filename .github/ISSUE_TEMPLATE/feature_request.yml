name: Feature request
description: Suggest an improvement for the kit or skills
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: Installer / CI
        - label: Documentation
        - label: Example skill (generic)
        - label: Docker
        - label: Security defaults
